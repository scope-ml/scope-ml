# ──────────────────────────────────────────────────────────────────────
# Model hyperparameters
# ──────────────────────────────────────────────────────────────────────
model:
  backbone_dims: [256, 128, 64]
  dropout: [0.3, 0.3, 0.2]
  batch_norm: true

training:
  epochs: 100
  batch_size: 512
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_epochs: 5
  val_fraction: 0.15
  label_threshold: 0.5
  early_stopping_patience: 15

  # Per-head loss weights (relative).  Set to 0 to disable a head.
  head_weights:
    vnv: 1.0
    pnp: 1.0
    morphology: 1.0
    nonperiodic_type: 1.0
    eclipsing_subtype: 1.0
    sinusoidal_subtype: 1.0
    sawtooth_subtype: 1.0
    bogus: 0.5
    wrong_period: 0.5
