# Hierarchical classifier configuration for SCoPe variable star taxonomy.
#
# Taxonomy aligns with timedomain-taxonomy (tdtax) by Josh Bloom:
#   https://github.com/profjsb/timedomain-taxonomy
#
# Our hierarchy simplifies tdtax's ~169 classes into a practical tree
# that matches the resolution achievable from ZTF light-curve features.

# ──────────────────────────────────────────────────────────────────────
# Taxonomy tree
# ──────────────────────────────────────────────────────────────────────
# Each node has:
#   name          - internal identifier
#   classes       - ordered list of class names (index = integer label)
#   label_map     - maps class name → list of training-set label columns
#                   A source belongs to a class if max(columns) >= threshold
#   parent        - name of parent node (null for root)
#   parent_class  - which parent class gates this node
#   threshold     - confidence threshold for assigning labels (default 0.5)

taxonomy:
  # Level 0: variable vs non-variable (binary)
  # tdtax: top-level split — "Time-domain Source" has stellar-variable vs not
  vnv:
    classes: ["non_variable", "variable"]
    label_map:
      non_variable: ["non-variable"]
      variable: ["variable"]
    parent: null
    parent_class: null

  # Level 1: periodic vs non-periodic (binary, gated on variable)
  # tdtax: periodic stellar variables vs aperiodic/irregular
  pnp:
    classes: ["non_periodic", "periodic"]
    label_map:
      non_periodic: null  # inferred: variable=1 AND periodic=0
      periodic: ["periodic"]
    parent: vnv
    parent_class: variable

  # Level 2a: morphology of periodic variables (4-class)
  # Maps to tdtax top-level categories: Eclipsing, Pulsating (split by
  # light-curve shape), and LPV branch
  morphology:
    classes: ["eclipsing", "sinusoidal_pulsator", "sawtooth_pulsator", "long_timescale"]
    label_map:
      # tdtax: Eclipsing (W Ursae Maj, Algol, Beta Lyrae, Compact Binary, ...)
      eclipsing: ["eclipsing"]
      # tdtax: Pulsating with sinusoidal shape — Delta Scuti, RR Lyrae c,
      #        Gamma Doradus, SX Phe; plus Rotating — RS CVn, ellipsoidal
      sinusoidal_pulsator: ["sinusoidal", "Delta Scu", "RR Lyrae c",
                            "RS CVn", "ellipsoidal"]
      # tdtax: Pulsating with sawtooth/asymmetric shape — RR Lyrae ab,
      #        Cepheid (Classical, Type II, BL Her, W Vir)
      sawtooth_pulsator: ["sawtooth", "RR Lyrae ab", "Cepheid"]
      # tdtax: LPV branch — Mira, Semiregular, OSARG
      long_timescale: ["long timescale", "LPV", "Mira", "SRV", "OSARG"]
    parent: pnp
    parent_class: periodic

  # Level 2b: type of non-periodic variable (4-class)
  # Maps to tdtax: Eruptive (UV Ceti/flaring, YSO), Nonstellar (AGN),
  # Cataclysmic (CV), and irregular variability
  nonperiodic_type:
    classes: ["irregular", "flaring", "accreting", "yso"]
    label_map:
      # tdtax: irregular variability, dipping (folded in)
      irregular: ["irregular", "dipping"]
      # tdtax: Eruptive → UV Ceti (flare star)
      flaring: ["flaring"]
      # tdtax: Nonstellar → AGN; Cataclysmic → CV (novae, dwarf novae)
      accreting: ["AGN", "CV"]
      # tdtax: Eruptive → YSO (FU Ori, T Tauri, Herbig AE/BE)
      yso: ["YSO"]
    parent: pnp
    parent_class: non_periodic

  # Level 3a: eclipsing subtypes (3-class)
  # tdtax: Eclipsing subtypes — W Ursae Maj, Algol, Beta Lyrae
  eclipsing_subtype:
    classes: ["ew_wuma", "ea_detached", "eb_betalyr"]
    label_map:
      # tdtax: W Ursae Maj (EW, contact binary, EWa + EWw subtypes)
      ew_wuma: ["W UMa", "EW"]
      # tdtax: Algol (EA, semidetached) + detached MS-MS + HW Vir
      ea_detached: ["EA", "detached eclipsing MS-MS",
                    "eclipsing sdB+dM (HW Vir)"]
      # tdtax: Beta Lyrae (EB, giant/supergiant) + compact binary + NN Ser
      eb_betalyr: ["EB", "Beta Lyr", "compact binary",
                   "eclipsing WD+dM (NN Ser)", "Redback pulsar"]
    parent: morphology
    parent_class: eclipsing

  # Level 3b: sinusoidal pulsator subtypes (3-class)
  # tdtax: Pulsating subtypes with sinusoidal morphology + Rotating
  sinusoidal_subtype:
    classes: ["delta_scuti", "rr_lyrae_c", "rotational"]
    label_map:
      # tdtax: Delta Scuti (DSCT, HADS, LADS) + SX Phe + Gamma Doradus
      delta_scuti: ["Delta Scu"]
      # tdtax: RR Lyrae → RRc (sinusoidal profile) + RRd (double-mode)
      rr_lyrae_c: ["RR Lyrae c", "RR Lyrae d"]
      # tdtax: Rotating → RS CVn; also ellipsoidal (tidal distortion)
      rotational: ["RS CVn", "ellipsoidal"]
    parent: morphology
    parent_class: sinusoidal_pulsator

  # Level 3c: sawtooth pulsator subtypes (3-class)
  # tdtax: Pulsating subtypes with asymmetric (sawtooth) morphology
  sawtooth_subtype:
    classes: ["rr_lyrae_ab", "cepheid", "other_sawtooth"]
    label_map:
      # tdtax: RR Lyrae → RRab (steep rise / slow fall) + Blazhko modulation
      rr_lyrae_ab: ["RR Lyrae ab", "RR Lyrae Blazhko"]
      # tdtax: Cepheid (Classical, Anomalous) + Population II Cepheid
      #        (BL Her, W Vir) + RV Tau
      cepheid: ["Cepheid", "Cepheid type-II", "BL Her", "W Virginis", "RV Tau"]
      # Remainder: sawtooth label but not clearly RRab or Cepheid
      other_sawtooth: ["sawtooth"]
    parent: morphology
    parent_class: sawtooth_pulsator

  # Orthogonal quality flags (binary, trained on ALL sources)
  quality_flags:
    bogus:
      label_columns: ["bogus"]
    wrong_period:
      label_columns: ["wrong period"]

